<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Warframe GID</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 340px;
        margin: 0;
        padding: 12px;
        font-size: 14px;
      }
      h1 { font-size: 16px; margin: 0 0 8px; }
      #value {
        font-family: monospace;
        word-break: break-all;
        background: #f3f3f3;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 6px;
        min-height: 1.5em;
        margin-bottom: 8px;
      }
      button {
        padding: 6px 12px;
        cursor: pointer;
      }
      button:disabled { cursor: default; opacity: 0.5; }
      #status { margin-left: 8px; color: #555; }
      .muted { color: #777; }
      hr { border: none; border-top: 1px solid #ddd; margin: 12px 0; }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      select { padding: 4px; }
      #dataStatus { margin-top: 6px; color: #555; word-break: break-word; }
    </style>
  </head>
  <body>
    <h1>Warframe Account ID Grabber</h1>
    <div id="value" class="muted">Loading…</div>
    <button id="copy" disabled>Copy</button>
    <button id="refresh">Refresh</button>
    <span id="status"></span>

    <hr>

    <h1>Account Data</h1>
    <div class="row">
      <label for="platform">Platform:</label>
      <select id="platform">
        <option value="pc">PC</option>
        <option value="ps4">PlayStation</option>
        <option value="xb1">Xbox</option>
        <option value="swi">Switch</option>
        <option value="mob">iOS</option>
        <option value="and">Android</option>
      </select>
    </div>
    <div class="row">
      <button id="fetchData" disabled>Open Account Data</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
