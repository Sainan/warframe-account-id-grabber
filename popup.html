<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Warframe GID</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 340px;
        margin: 0;
        padding: 12px;
        font-size: 14px;
      }
      h1 { font-size: 16px; margin: 0 0 8px; }
      #value {
        font-family: monospace;
        word-break: break-all;
        background: #f3f3f3;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 6px;
        min-height: 1.5em;
        margin-bottom: 8px;
      }
      button {
        padding: 6px 12px;
        cursor: pointer;
      }
      #status { margin-left: 8px; color: #555; }
      .muted { color: #777; }
    </style>
  </head>
  <body>
    <h1>Warframe Account ID Grabber</h1>
    <div id="value" class="muted">Loading…</div>
    <button id="copy" disabled>Copy</button>
    <button id="refresh">Refresh</button>
    <span id="status"></span>
    <script src="popup.js"></script>
  </body>
</html>
